[package]
name = "senzing-sdk-rust-grpc"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = { version = "*", features = ["tls-ring", "tls-native-roots"] }
prost = "0.14"
tokio = { version = "1.0", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
tokio-stream = "0.1"

async-stream = "0.3.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9.2"
tonic-prost = "0.14.2"
futures = "0.3.31"
pkcs8 = { version = "0.10", features = ["encryption", "pem"] }
phf = { version = "0.11", features = ["macros"] }

[build-dependencies]
tonic-prost-build = "*"
